[package]
name = "iqif-vio"
version = "0.1.0"
edition = "2021"
description = "Neuromorphic VIO: predictive-coding 6-DoF egomotion on IQIF, fed by the Rudolf-V visual frontend"
license = "MIT"

[dependencies]
# Path: the in-workspace bit-exact IQIF dynamics.
iqif-core = { path = "../iqif-core" }
# Git (rev pinned in Cargo.lock): the Rudolf-V visual frontend (KLT tracking,
# sparse stereo depth, geometry-first camera models incl. fisheye/equidistant
# for TUM-VI). Public repo.
rudolf-v = { git = "https://github.com/twetto/Rudolf-V.git", rev = "bc262650974a9e2abcb74ef1ee77c9145a4234b5" }
# Linear algebra for QR whitening / decode (same version Rudolf-V uses).
nalgebra = "0.33"

[dev-dependencies]
# Image I/O for the EuRoC example (loading dataset PNGs).
image = "0.25"
# Live visualization window for the euroc_egomotion_live example.
minifb = "0.27"
